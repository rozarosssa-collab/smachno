kermit = "2.2.0"
koin = "4.2.2"
ktor = "3.6.0"
ksafe = "3.3.0"
multiplatform-settings = "1.3.0"
kotlinx-serialization = "1.11.0"
navigation3 = "1.1.2"
paging = "3.5.3"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
